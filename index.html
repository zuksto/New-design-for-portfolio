<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Website</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar">
      <a href="#" class="logo">Portfolio</a>
      <ul>
        <li class="active"><a href="./index.html">Home</a></li>
        <li><a href="./about.html">About</a></li>
        <li><a href="#">Portfolio</a></li>
        <li><a href="#">Service</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>

    <div class="bars-animation">
      <div class="bar" style="--i: 6"></div>
      <div class="bar" style="--i: 5"></div>
      <div class="bar" style="--i: 4"></div>
      <div class="bar" style="--i: 3"></div>
      <div class="bar" style="--i: 2"></div>
      <div class="bar" style="--i: 1"></div>
    </div>

    <section class="home">
      <div class="home-info">
        <h1>Zurab Kavtaradze</h1>
        <h2>I'm a Web Developer</h2>
        <p>If you willing to contact me I'm available for 24/7</p>
        <div class="btn-sci">
          <a href="#" class="btn">Download CV</a>
          <div class="sci">
            <a href="#"><i class="bx bxl-github"></i></a>
            <a href="#"><i class="bx bxl-linkedin"></i></a>
            <a href="#"><i class="bx bxl-twitter"></i></a>
            <a href="#"><i class="bx bxl-youtube"></i></a>
          </div>
        </div>
      </div>

      <div class="home-img">
        <div class="img-box">
          <div class="img-item">
            <img src="./assets/Logo.png" alt="Photo" />
          </div>
        </div>
      </div>
    </section>
    <footer class="footer">
      <div class="footer-content">
        <div class="footer-section">
          <h3 class="glow-text">Navigate</h3>
          <ul class="footer-links">
            <li><a href="./index.html">Home</a></li>
            <li><a href="./about.html">About</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
          </ul>
        </div>

        <div class="footer-section">
          <h3 class="glow-text">Connect</h3>
          <div class="footer-social">
            <a href="#" class="social-icon"><i class="fab fa-github"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-linkedin"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
          </div>
        </div>

        <div class="footer-section">
          <h3 class="glow-text">Newsletter</h3>
          <div class="newsletter">
            <input
              type="email"
              placeholder="Enter your email"
              class="footer-input"
            />
            <button class="footer-btn">Subscribe</button>
          </div>
        </div>
      </div>

      <div class="footer-bottom">
        <div class="footer-line"></div>
        <p>&copy; 2025 Zurab Portfolio. All rights reserved.</p>
        <div class="footer-shapes">
          <div class="shape"></div>
          <div class="shape"></div>
          <div class="shape"></div>
        </div>
      </div>
    </footer>
  </body>
</html>
